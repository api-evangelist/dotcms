        name:
          type: string
          description: Folder name (last path segment)
        path:
          type: string
          description: Parent path of the folder, e.g. '/application/' for '/application/blog/'
        addChildrenAllowed:
          type: boolean
          description: True when the requesting user has CAN_ADD_CHILDREN on this folder
        hasChildren:
          type: boolean
          description: True when the folder has at least one child folder readable by the requesting user
        defaultBaseType:
          type: string
          description: Content Drive upload-mode preference as a BaseContentType name (e.g. DOTASSET, FILEASSET); null when the folder has no preference
        title:
          type: string
          description: Folder title
        sortOrder:
          type: integer
          description: Folder sort order used when ordering menu items
          format: int32
        filesMasks:
          type: string
          description: Comma-separated file-name masks allowed in this folder, e.g. '*.jpg,*.png'
        defaultFileType:
          type: string
          description: Velocity variable name of the Content Type used by default for new files in this folder
        showOnMenu:
          type: boolean
          description: True when the folder is shown on navigation menus
        permissions:
          type: array
          description: Permission types the requesting user holds on this folder. Only populated when 'includePermissions=true'; null means the permissions were not requested, while an empty array means they were requested and the user holds none.
          items:
            type: string
            enum:
            - READ
            - EDIT
            - PUBLISH
            - EDIT_PERMISSIONS
            - CAN_ADD_CHILDREN
