openapi: 3.2.0
info:
  title: dotCMS REST Folders API
  version: '3'
  description: Endpoints for managing folder structure and organization
servers:
- url: /
  description: dotCMS Server
tags:
- name: Folders
  description: Endpoints for managing folder structure and organization
paths:
  /api/v1/folder/createfolders/{siteName}:
    post:
      tags:
      - Folders
      summary: Create folders by paths on a site
      description: Creates one or more folders on the specified site. The request body is a raw JSON array of folder paths (e.g., ["/path1", "/path2/subpath"]). Nested paths will create intermediate folders as needed.
      operationId: createFoldersBySiteName
      parameters:
      - name: siteName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: Folders created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityListView'
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Site not found
  /api/v1/folder/{siteName}:
    delete:
      tags:
      - Folders
      summary: Delete one or more path for a site
      description: Delete one or more path for a site if they exist
      operationId: deleteFoldersBySiteName
      parameters:
      - name: siteName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: Folders deleted successfully
          content:
            application/json:
              example:
                entity:
                - /folder-1/folder-2/target-folder
                errors: []
                i18nMessagesMap: {}
                messages: []
                pagination: null
                permissions: []
        '401':
          description: Unauthorized access
        '404':
          description: Folders not found
        '403':
          description: Insufficient permissions to delete folders
  /api/v1/folder/{folderId}:
    get:
      tags:
      - Folders
      summary: Find a folder by ID
      description: Retrieves a folder by its identifier. Returns 404 if the folder does not exist.
      operationId: findFolderById
      parameters:
      - name: folderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Folder retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityFolderView'
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Folder not found
  /api/v1/folder/byPath:
    post:
      tags:
      - Folders
      summary: Find subfolders by path (deprecated)
      description: Retrieves subfolders of a given path, filtered by the path sent. This endpoint is deprecated — use GET /api/v1/folder/search instead.
      operationId: findSubFoldersByPath
      parameters:
      - name: offset
        in: query
        description: Number of results to skip for pagination. Must be >= 0.
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Maximum number of results to return. Default 40. Use -1 for unlimited (capped at 10000 as a safety limit).
        schema:
          type: integer
          format: int32
          default: 40
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/SearchByPathForm'
      responses:
        '200':
          description: Subfolders retrieved successfully (deprecated endpoint)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityFolderSearchResultView'
        '400':
          description: Path property must be sent
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Site not found
      deprecated: true
  /api/v1/folder/siteId/{siteId}/path/{path}:
    get:
      tags:
      - Folders
      summary: Load folder and subfolders by path
      description: Finds a folder by the given path within the specified site and returns the folder along with all its subfolders, respecting the user's permissions.
      operationId: loadFolderAndSubFoldersByPath
      parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        schema:
          pattern: .+
          type: string
      responses:
        '200':
          description: Folder and subfolders retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityFolderWithSubfoldersView'
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Folder not found
  /api/v1/folder/sitename/{siteName}/uri/{uri}:
    get:
      tags:
      - Folders
      summary: Load a folder by site name and URI
      description: Retrieves a folder by its URI path within the specified site.
      operationId: loadFolderByURI
      parameters:
      - name: siteName
        in: path
        description: Site hostname the folder lives on (e.g. 'demo.dotcms.com').
        required: true
        schema:
          type: string
      - name: uri
        in: path
        description: Folder path within the site, as a plain path — e.g. 'application/themes/travel' (a leading slash is optional and added if missing). Embedded slashes are allowed (they select nested folders). Pass the raw path; do NOT percent-encode the slashes (a pre-encoded '%2F...' will not match).
        required: true
        schema:
          pattern: .+
          type: string
      responses:
        '200':
          description: Folder retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityFolderView'
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Folder not found
  /api/v1/folder/search:
    get:
      tags:
      - Folders
      summary: Search folders
      description: Returns folders within a site matching an optional name filter and/or path scope. Supports recursive depth control, standard pagination, and sorting. With no 'name' and default path '/' + recursive=true, all site folders are returned. Each folder carries the detail fields a folder-edit form needs (title, sortOrder, filesMasks, defaultFileType, showOnMenu, defaultBaseType). Set 'includePermissions=true' to also receive the permission types the requesting user holds on each folder; that flag caps 'perPage' (see the parameter description).
      operationId: searchFolders
      parameters:
      - name: name
        in: query
        description: Optional case-insensitive partial match on folder name (minimum 2 characters when provided)
        schema:
          type: string
      - name: path
        in: query
        description: Path scope for the search. Defaults to '/' (site root).
        schema:
          type: string
          default: /
      - name: recursive
        in: query
        description: false = direct children of 'path' only (default); true = search all descendants
        schema:
          type: boolean
          default: false
      - name: siteId
        in: query
        description: Site ID to scope the search (required)
        schema:
          type: string
      - name: orderby
        in: query
        description: Column to sort by.
        schema:
          type: string
          enum:
          - name
          - mod_date
          default: name
      - name: direction
        in: query
        description: Sort direction
        schema:
          type: string
          enum:
          - ASC
          - DESC
          default: ASC
      - name: page
        in: query
        description: Page number (1-based, default 1)
        schema:
          type: integer
          format: int32
          default: 1
      - name: per_page
        in: query
        description: Number of results per page (default 40)
        schema:
          type: integer
          format: int32
          default: 40
      - name: includePermissions
        in: query
        description: When true, each returned folder includes a 'permissions' array with the permission types the requesting user holds on it (READ, EDIT, PUBLISH, EDIT_PERMISSIONS, CAN_ADD_CHILDREN). When false (the default) 'permissions' is null — meaning 'not requested', which is not the same as an empty array ('requested, no grants'). Because permissions are resolved per page, enabling this flag caps 'perPage' at the value of the 'content.drive.folder.search.permissions.max.per.page' configuration property (default 200); a larger 'perPage' is rejected with a 400.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Paginated list of matching folders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityFolderSearchView'
        '400':
          description: '''siteId'' is required; ''name'' must be at least 2 characters if provided; ''perPage'' exceeds the maximum allowed when ''includePermissions'' is true'
        '401':
          description: User is not authenticated
        '500':
          description: Internal server error
  /api/v1/folder/{id}/file-browser-selected:
    put:
      tags:
      - Folders
      summary: Select folder in file browser
      description: Marks a folder as the currently selected folder in the file browser session.
      operationId: selectFolderInFileBrowser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Folder selected successfully
        '401':
          description: Authentication required
