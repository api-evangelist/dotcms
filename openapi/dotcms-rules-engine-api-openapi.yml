components:
  schemas:
    RestRuleAction:
      required:
      - owningRule
      type: object
      properties:
        owningRule:
          type: string
        priority:
          type: integer
          format: int32
        actionlet:
          type: string
        parameters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ParameterModel'
    ParameterModel:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        key:
          type: string
        value:
          type: string
        priority:
          type: integer
          format: int32
    RestConditionValue:
      required:
      - key
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        priority:
          type: integer
          format: int32
    RestRule:
      type: object
      properties:
        name:
          type: string
        fireOn:
          type: string
        shortCircuit:
          type: boolean
        priority:
          type: integer
          format: int32
        enabled:
          type: boolean
        conditionGroups:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RestConditionGroup'
        ruleActions:
          type: object
          additionalProperties:
            type: boolean
    RestConditionGroup:
      required:
      - operator
      type: object
      properties:
        operator:
          type: string
        priority:
          type: integer
          format: int32
        conditions:
          type: object
          additionalProperties:
            type: boolean
    RestCondition:
      required:
      - conditionlet
      - operator
      - owningGroup
      type: object
      properties:
        owningGroup:
          type: string
        conditionlet:
          type: string
        values:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RestConditionValue'
        operator:
          type: string
        priority:
          type: integer
          format: int32
