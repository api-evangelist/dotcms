      summary: Updates a field in a Content Type
      description: Updates a field in a Content Type. The request body is wrapped in a required top-level `field` property. To update a constant field such as a WIDGET's `widgetCode`, fetch the existing field, preserve its attributes, change `values`, and send `{"field":{...}}`.
