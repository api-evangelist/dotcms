openapi: 3.2.0
info:
  title: dotCMS REST Content Type Field API
  version: '3'
  description: Content type field definitions and configuration
servers:
- url: /
  description: dotCMS Server
tags:
- name: Content Type Field
  description: Content type field definitions and configuration
paths:
  /api/v1/fieldTypes:
    get:
      tags:
      - Content Type Field
      summary: Get field types
      description: Retrieves all available field types in dotCMS for content type configuration
      operationId: getFieldTypes
      responses:
        '200':
          description: Field types retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityFieldTypeListView'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json: {}
  /api/v1/contenttype/{typeId}/fields:
    get:
      tags:
      - Content Type Field
      summary: Get content type fields (deprecated)
      description: Retrieves all fields for a specific content type. Use v2 API instead for new implementations.
      operationId: getContentTypeFieldsV1
      parameters:
      - name: typeId
        in: path
        description: Content type ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Fields retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityListMapView'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json: {}
        '404':
          description: Content type not found
          content:
            application/json: {}
        '500':
          description: Internal server error
          content:
            application/json: {}
      deprecated: true
    put:
      tags:
      - Content Type Field
      summary: Update content type fields (deprecated)
      description: Updates multiple fields for a content type. Use v2 API instead.
      operationId: updateContentTypeFieldsV1
      parameters:
      - name: typeId
        in: path
        description: Content type ID
        required: true
        schema:
          type: string
      requestBody:
        description: Array of field objects to save on the content type.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ContentTypeFieldView'
        required: true
      responses:
        '200':
          description: Fields updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityListMapView'
        '400':
          description: Bad request - invalid field data
          content:
            application/json: {}
        '401':
          description: Unauthorized - authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json: {}
        '404':
          description: Not found - content type not found
          content:
            application/json: {}
      deprecated: true
    post:
      tags:
      - Content Type Field
      summary: Create content type field (deprecated)
      description: Creates a new field for a content type. Use v2 API instead.
      operationId: createContentTypeFieldV1
      parameters:
      - name: typeId
        in: path
        description: Content type ID
        required: true
        schema:
          type: string
      requestBody:
        description: 'A SINGLE field object to create on the content type. This endpoint creates exactly one field: if you pass a JSON array, only the first element is saved (it returns 200 and silently drops the rest). To add multiple fields at once, use PUT /api/v1/contenttype/{typeId}/fields (which takes an array), or include them inline as the ''fields'' array when creating the content type via POST /api/v1/contenttype.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentTypeFieldView'
        required: true
      responses:
        '200':
          description: Field created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityMapStringObjectView'
        '400':
          description: Bad request - invalid field data
          content:
            application/json: {}
        '401':
          description: Unauthorized - authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json: {}
        '404':
          description: Not found - content type not found
          content:
            application/json: {}
      deprecated: true
    delete:
      tags:
      - Content Type Field
      summary: Delete multiple fields (deprecated)
      description: Deletes multiple fields from a content type by their field IDs. Use v2 API instead for new implementations.
      operationId: deleteContentTypeFieldsV1
      parameters:
      - name: typeId
        in: path
        description: Content type ID
        required: true
        schema:
          type: string
      requestBody:
        description: Array of field IDs to delete
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: Fields deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityMapView'
        '400':
          description: Bad request - invalid field IDs
          content:
            application/json: {}
        '401':
          description: Unauthorized - authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json: {}
        '404':
          description: Content type or one or more fields not found
          content:
            application/json: {}
        '500':
          description: Internal server error
          content:
            application/json: {}
      deprecated: true
