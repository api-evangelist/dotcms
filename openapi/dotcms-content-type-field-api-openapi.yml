      tags:
      - Content Type Field
      summary: Deletes fields from a Content Type
      description: Deletes one or more fields from a Content Type and returns the updated field layout together with the IDs that were actually deleted. A field being used as the Content Type's Publish or Expire date field cannot be deleted until it is unlinked.
