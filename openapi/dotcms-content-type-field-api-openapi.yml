elds-1\",\n                        \"readOnly\": false,\n                        \"required\": false,\n                        \"searchable\": false,\n                        \"sortOrder\": 1,\n                        \"unique\": false,\n                        \"variable\": \"fields1\"\n                    },\n                    \"fields\": [\n                        {\n                            \"clazz\": \"com.dotcms.contenttype.model.field.ImmutableTextField\",\n                            \"contentTypeId\": \"3b70f386cf65117a675f284eea928415\",\n                            \"dataType\": \"TEXT\",\n                            \"fieldType\": \"Text\",\n                            \"fieldTypeLabel\": \"Text\",\n                            \"fieldVariables\": [],\n                            \"fixed\": false,\n                            \"forceIncludeInApi\": false,\n                            \"iDate\": 1764268380000,\n                            \"id\": \"ba34f109c9e86793384387e2619267ea\",\n                            \"indexed\": true,\n                            \"listed\": true,\n                            \"modDate\": 1764277924000,\n                            \"name\": \"Title\",\n                            \"readOnly\": false,\n                            \"required\": false,\n                            \"searchable\": false,\n                            \"sortOrder\": 2,\n                            \"unique\": false,\n                            \"variable\": \"title\"\n                        },\n                        {\n                            \"clazz\": \"com.dotcms.contenttype.model.field.ImmutableCustomField\",\n                            \"contentTypeId\": \"3b70f386cf65117a675f284eea928415\",\n                            \"dataType\": \"LONG_TEXT\",\n                            \"fieldType\": \"Custom-Field\",\n                            \"fieldTypeLabel\": \"Custom Field\",\n                            \"fieldVariables\": [\n   