  /api/v1/content/_import/_validate:
    post:
      tags:
      - Content
      summary: Validates content import from a CSV file
      description: Creates and enqueues a content import job in preview mode. This validates the CSV data against the specified Content Type, language, and workflow action without actually importing content.
      operationId: validateContentImport
      requestBody:
        description: "This endpoint accepts a `multipart/form-data` request with two fields:\n\n| **Field** | **Type** | **Required** | **Description** |\n|-----------|----------|--------------|-----------------|\n| `file`    | File     | ✅ Yes        | The CSV file to import. Must contain content rows and match the expected structure for the content type. |\n| `form`    | String   | ✅ Yes        | A JSON string containing the import parameters. See structure below. |\n\n**`form` field structure:**\n\n| **Property**         | **Type**   | **Required** | **Default** | **Description** |\n|----------------------|------------|--------------|-------------|-----------------|\n| `contentType`        | String     | ✅ Yes        | –           | Content Type variable or ID to import data into. |\n| `language`           | String     | ❌ No         | Default language | Language code (e.g., `en-US`) or language ID. |\n| `workflowActionId`   | String     | ✅ Yes        | –           | Workflow Action UUID to apply to imported content. |\n| `fields`             | String[]   | ❌ No         | –           | List of field variables or IDs used as keys for content updates. |\n| `stopOnError`        | Boolean    | ❌ No         | `false`     | Whether to stop import on first validation error. |\n| `commitGranularity`  | Integer    | ❌ No         | `100`       | Number of rows to commit in each transaction batch. |\n\n**Example `form` value:**\n\n```json\n{\n  \"contentType\": \"webPageContent\",\n  \"language\": \"en-US\",\n  \"workflowActionId\": \"b9d89c80-3d88-4311-8365-187323c96436\",\n  \"fields\": [\"title\"],\n  \"stopOnError\": false,\n  \"commitGranularity\": 100\n}\n```"
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContentImportParamsSchema'
        required: true
      responses:
        '200':
          description: Content import validation job successfully created and enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityJobStatusView'
              example:
                entity:
                  jobId: e6d9bae8-657b-4e2f-8524-c0222db66355
                  statusUrl: http://localhost:8080/api/v1/_import/e6d9bae8-657b-4e2f-8524-c0222db66355
                errors: []
                i18nMessagesMap: {}
                messages: []
                pagination: null
                permissions: []
        '400':
          description: 'Bad Request: Invalid parameters or malformed request (e.g., missing file, invalid JSON in ''form'', file not CSV).'
        '401':
          description: 'Unauthorized: Invalid or missing user authentication.'
        '403':
          description: 'Forbidden: User does not have necessary permissions for validation or workflow action.'
        '404':
          description: 'Not Found: Specified Content Type or Language could not be found.'
        '500':
          description: 'Internal Server Error: An unexpected error occurred during job creation or processing.'
components:
  schemas:
    JobResult:
      type: object
      properties:
        errorDetail:
          $ref: '#/components/schemas/ErrorDetail'
        metadata:
          type: object
          additionalProperties:
            type: object
    ContentImportParamsSchema:
      required:
      - file
      - form
      type: object
      properties:
        file:
          type: string
          description: The CSV file to import.
          format: binary
        form:
          type: string
          description: JSON string representing import settings.
          example: "{\n  \"contentType\": \"activity\",\n  \"language\": \"en-US\",\n  \"workflowActionId\": \"b9d89c80-3d88-4311-8365-187323c96436\",\n  \"fields\": [\"title\"]\n  \"stopOnError\":false \n  \"commitGranularity\": 100\n}"
      description: Schema for content import parameters.
    ResponseEntityJobStatusView:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntity'
        entity:
          $ref: '#/components/schemas/JobStatusResponse'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageEntity'
        i18nMessagesMap:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: array
          items:
            type: string
        pagination:
          $ref: '#/components/schemas/Pagination'
    JobPaginatedResult:
      type: object
      properties:
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        jobs:
          type: array
          properties:
            empty:
              type: boolean
            first:
              $ref: '#/components/schemas/Job'
            last:
              $ref: '#/components/schemas/Job'
          items:
            $ref: '#/components/schemas/Job'
    Job:
      type: object
      properties:
        id:
          type: string
        queueName:
          type: string
        state:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCESS
          - FAILED
          - FAILED_PERMANENTLY
          - ABANDONED
          - ABANDONED_PERMANENTLY
          - CANCEL_REQUESTED
          - CANCELLING
          - CANCELED
        executionNode:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/JobResult'
        parameters:
          type: object
          properties:
            empty:
              type: boolean
          additionalProperties:
            type: object
        retryCount:
          type: integer
          format: int32
        progress:
          type: number
          format: float
    ResponseEntityMapStringObjectView:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntity'
        entity:
          type: object
          additionalProperties:
            type: object
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageEntity'
        i18nMessagesMap:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: array
          items:
            type: string
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          format: int32
        perPage:
          type: integer
          format: int32
        totalEntries:
          type: integer
          format: int64
    SearchForm:
      type: object
      properties:
        query:
          type: string
          description: "Lucene query. IMPORTANT: custom (user-defined) fields MUST be qualified with the content type's variable name — `ContentTypeVar.fieldVar`. A BARE field name matches nothing and returns zero results with NO error (a common silent failure). For example, to find featured Books use `+AwazonBook.featured:true`, not `+featured:true`; to match a slug use `+AwazonBook.slug:my-slug`. Restrict the type with `+contentType:AwazonBook` (contentType is a system field, unqualified). \n\nResults are also HOST-scoped: unless you add a host clause, the search resolves against the current request's site and will NOT return content that lives on a different host (e.g. content saved to `SYSTEM_HOST`/default while you query as another site). Constrain the host explicitly with `+conHost:<siteIdentifier>` (or `+conHost:SYSTEM_HOST`), and add `+live:true` / `+working:true` and `+deleted:false` as needed. See the Lucene content-search syntax docs."
          example: +contentType:AwazonBook +AwazonBook.featured:true +live:true +deleted:false
        sort:
          type: string
          description: Sort clause, e.g. `AwazonBook.title asc` or `modDate desc`. Custom fields are qualified the same way as in `query`.
          example: modDate desc
        limit:
          type: integer
          description: Maximum number of contentlets to return (page size).
          format: int32
          example: 20
          default: 20
        offset:
          type: integer
          description: Zero-based result offset for paging.
          format: int32
          example: 0
          default: 0
        userId:
          type: string
          description: Optional user id to run the search as (permissions are applied for this user). Defaults to the authenticated caller when omitted.
        render:
          type: string
          description: When set to `true`, each matching contentlet's `htmlpageasset`/widget content is rendered and included in the response. Omit for raw field data only.
        depth:
          type: integer
          description: 'Relationship-loading depth (0-3): how many levels of related content to inline. `-1` (default) loads none.'
          format: int32
          example: 1
          default: -1
        languageId:
          type: integer
          description: Language id to search in. Defaults to the system default language when omitted.
          format: int64
          example: 1
        allCategoriesInfo:
          type: boolean
          description: When `true`, include full category metadata for category fields in the results.
      description: Content search request. `query` is a Lucene expression; the remaining fields control paging, sorting, language, and how results are rendered.
    ResponseEntityPaginatedDataView:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntity'
        entity:
          type: object
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageEntity'
        i18nMessagesMap:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: array
          items:
            type: string
        pagination:
          $ref: '#/components/schemas/Pagination'
    Permissionable:
      type: object
      properties:
        parentPermissionable:
          $ref: '#/components/schemas/Permissionable'
        permissionId:
          type: string
        permissionType:
          type: string
        owner:
          type: string
    ResponseEntityBooleanView:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntity'
        entity:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageEntity'
        i18nMessagesMap:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: array
          items:
            type: string
        pagination:
          $ref: '#/components/schemas/Pagination'
    BulkRefreshForm:
      required:
      - contentletIds
      type: object
      properties:
        contentletIds:
          maxItems: 2147483647
          minItems: 1
          type: array
          items:
            type: string
        includeDependencies:
          type: boolean
        includeItemResults:
          type: boolean
    ResponseEntityJobPaginatedResultView:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntity'
        entity:
          $ref: '#/components/schemas/JobPaginatedResult'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageEntity'
        i18nMessagesMap:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: array
          items:
            type: string
        pagination:
          $ref: '#/components/schemas/Pagination'
    CountView:
      type: object
      properties:
        count:
          type: integer
          format: int32
    PullRelatedForm:
      required:
      - fieldVariable
      - identifier
      - limit
      - offset
      - orderBy
      type: object
      properties:
        fieldVariable:
          type: string
        identifier:
          type: string
        condition:
          type: string
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        orderBy:
          type: string
    MessageEntity:
      type: object
      properties:
        message:
          type: string
    ResponseEntityContentletView:
      type: object
      properties:
        errors:
