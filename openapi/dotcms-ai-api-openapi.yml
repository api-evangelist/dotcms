    AIImageRequestDTO:
      type: object
      properties:
        prompt:
          type: string
        numberOfImages:
          type: integer
          format: int32
        size:
          type: string
        model:
          type: string
    ErrorEntity:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
        fieldName:
          type: string
    ResponseEntityAiProviderListView:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntity'
        entity:
          type: array
          items:
            $ref: '#/components/schemas/ProviderMetadata'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageEntity'
        i18nMessagesMap:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: array
          items:
            type: string
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          format: int32
        perPage:
          type: integer
          format: int32
        totalEntries:
          type: integer
          format: int64
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        roleKey:
          type: string
        parent:
          type: string
        editPermissions:
          type: boolean
        editUsers:
          type: boolean
        editLayouts:
          type: boolean
        locked:
          type: boolean
        system:
          type: boolean
        roleChildren:
          type: array
          items:
            type: string
        fqn:
          type: string
        dbfqn:
          type: string
        user:
          type: boolean
    TestConnectionResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
    EmbeddingsForm:
      type: object
      properties:
        query:
          type: string
        limit:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
        offset:
          minimum: 0
          type: integer
          format: int32
        indexName:
          type: string
        model:
          type: string
        velocityTemplate:
          type: string
        fields:
          type: array
          items:
            type: string
        userId:
          type: string
        requestHostId:
          type: string
    ProviderMetadata:
      type: object
      properties:
        provider:
          type: string
        supportedCapabilities:
          uniqueItems: true
          type: array
          items:
            type: string
            enum:
            - CHAT
            - EMBEDDINGS
            - IMAGE
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ProviderField'
    ResponseEntityAiTestConnectionView:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntity'
        entity:
          $ref: '#/components/schemas/TestConnectionResult'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageEntity'
        i18nMessagesMap:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: array
          items:
            type: string
        pagination:
          $ref: '#/components/schemas/Pagination'
    CompletionsForm:
      type: object
      properties:
        prompt:
          type: string
        searchLimit:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
        searchOffset:
