          type: integer
          format: int32
        responseLengthTokens:
          minimum: 128
          type: integer
          format: int32
        language:
          type: integer
          format: int64
        stream:
          type: boolean
        fieldVar:
          type: string
        indexName:
          type: string
        contentType:
          type: array
          items:
            type: string
        threshold:
          type: number
          format: float
        temperature:
          maximum: 2
          minimum: 0
          type: number
          format: float
        model:
          type: string
        operator:
          type: string
        site:
          type: string
        user:
