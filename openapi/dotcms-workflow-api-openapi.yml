  /api/v1/workflow/actions/{actionId}/firemultipart:
    put:
      tags:
      - Workflow
      summary: Fire action by ID (multipart form)
      description: 'Fires a workflow action, specified by identifier, on a target contentlet. Uses a multipart form to transmit its data.


        Returns a map of the resultant contentlet, with an additional `AUTO_ASSIGN_WORKFLOW` property, which can be referenced by delegate services that handle automatically assigning workflow schemes to content with none.


        **When chaining workflow actions or reading state back immediately after firing, pass `indexPolicy=WAIT_FOR` on each call.** The default `DEFER` is asynchronous and can return stale index reads for several seconds, which can mimic server-side state bugs. For isolated one-off fires where nothing reads the result, leave the default.


        **Block Editor (Story Block) fields:** send the value as a **Markdown or HTML** string — you do not need to hand-author the underlying ProseMirror/JSON document. dotCMS converts it to the Block Editor (ProseMirror JSON) structure automatically on save, so the field reads back as structured content with no editor round-trip required. A value that is already a valid Tiptap/ProseMirror JSON document is detected and stored unchanged. Example: `"body": "## Intro\n\nHello **world**."`.


        **Rich blocks in Markdown:** blocks that plain Markdown cannot express are written as fenced code blocks whose info string is a `dotcms-*` label and whose body is a small JSON object. Example — embed a contentlet:


        ```dotcms-content\n{"identifier": "", "languageId": 1}\n```


        Supported labels and payload fields (**bold** = required):

        - `dotcms-content` → embedded contentlet: **`identifier`**, `languageId` (default 1). The server rebuilds the full embed data from the identifier on every read.

        - `dotcms-image` → dotCMS-bound or decorated image: **`identifier` or `src`**; optional `alt`, `title`, `href`, `target`, `textWrap`, `textAlign`, `languageId`. Plain external images need no fence — standard `!alt` works.

        - `dotcms-video` → video: **`identifier` or `src`**; optional `mimeType`, `width`, `height`, `languageId`.

        - `dotcms-youtube` → YouTube embed: **`src`**; optional `start` (seconds), `width`, `height`.

        - `dotcms-grid` → layout grid: the verbatim `gridBlock` node JSON (`{"type":"gridBlock","attrs":{"columns":[n,n]},"content":[…two gridColumn nodes…]}`).

        - `dotcms-node` → any other node type verbatim (`{"type": "", …}`) — the fallback for custom blocks.


        **Rich blocks in HTML:** the same labels are namespaced custom elements. Scalar payloads ride as attributes with **hyphenated names** (HTML lowercases attribute names, so `languageId` is spelled `language-id`, `mimeType` is `mime-type`): `" language-id="1">`. `dotcms-ai`, `dotcms-grid` and `dotcms-node` take the same JSON object as the element''s text body instead (HTML-escape `` and would swallow the content after it. Both carriers produce identical stored documents.


        Block styling (e.g. text alignment) is set by an HTML comment on its own line immediately before the block it decorates, in Markdown and HTML alike: ``.


        A Markdown/HTML write **fully replaces** the stored document; when stored rich blocks are not carried over in the submitted value, the save still succeeds and an advisory warning listing the replaced blocks is returned in the response `messages` field — carry the blocks over as fences or elements to preserve them. An invalid payload degrades to an ordinary code block (or is dropped when it carries no text to keep), never an error.'
      operationId: putFireActionByIdMultipart
      parameters:
      - name: actionId
        in: path
        description: 'Identifier of a workflow action.


          Example value: `b9d89c80-3d88-4311-8365-187323c96436` (Default system workflow "Publish" action)'
        required: true
        schema:
          type: string
      - name: inode
        in: query
        description: Inode of the target content.
        schema:
          type: string
      - name: identifier
        in: query
        description: Identifier of target content.
        schema:
          type: string
      - name: indexPolicy
        in: query
        description: 'Determines how target content is indexed.


          | Value | Description |

          |-------|-------------|

          | `DEFER` | Content will be indexed asynchronously, outside of the current process. Valid content will finish the method in process and be returned before the content becomes visible in the index. This is the default index policy; it is resource-friendly and well-suited to batch processing. |

          | `WAIT_FOR` | The API call will not return from the content check process until the content has been indexed. Ensures content is promptly available for searching. |

          | `FORCE` | Forces Elasticsearch to index the content **immediately**.<br>**Caution:** Using this value may cause system performance issues; it is not recommended for general use, though may be useful for testing purposes. |


          '
        schema:
          type: string
          enum:
          - DEFER
          - WAIT_FOR
          - FORCE
      - name: language
        in: query
        description: Language version of target content.
        schema:
          type: string
          default: '-1'
      requestBody:
        description: Multipart form containing a JSON 'contentlet' body and optional binary field parts.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkflowActionMultipartSchema'
        required: true
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Fired action successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityMapView'
        '400':
          description: Bad request
        '404':
          description: Content not found
        '415':
          description: Unsupported Media Type
