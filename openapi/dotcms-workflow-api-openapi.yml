  /api/v1/workflow/contentlet/actions/_bulkfire:
    post:
      tags:
      - Workflow
      summary: Perform workflow actions on bulk content
      description: 'This operation allows you to specify a multiple content items (either by query or a list of identifiers), a workflow action to perform on them, and additional parameters as needed by the selected action. Responses are streamed as Server-Sent Events.


        ⚠️ **Important contract notes:**


        - `contentletIds` despite its name expects **inodes**, not identifiers. Passing identifiers results in a silent no-op with no error.

        - `additionalParams` must be present, even when empty (`{}`). Omitting it returns a `500` NPE.

        - The endpoint is **not step-aware**: if the action is not valid in a contentlet''s current step, the input is dropped silently (no `fails[]` entry). Verify post-fire state via `POST /api/content/_search`.

        - This endpoint behaves identically to `PUT /api/v1/workflow/contentlet/actions/bulk/fire`; only the response transport differs (SSE here vs JSON there).'
      operationId: postBulkActionsFire
      requestBody:
        description: 'Body consists of a JSON object with the following possible properties:


          | Property | Type | Description |

          |-|-|-|

          | `contentletIds` | List of Strings | A list of contentlet **inodes** (not identifiers, despite the property name). |

          | `query` | String | [Lucene query](https://www.dotcms.com/docs/latest/content-search-syntax#Lucene); uses all matching contentlets. |

          | `workflowActionId` | String | The identifier of the workflow action to be performed on the selected content. |

          | `additionalParams` | Object | Further parameters and properties are conveyed here, depending on the particulars of the selected action.<br><br>For a complete list of possible parameters, refer to the various keys listed in `GET /workflow/actionlets`. |


          If both `contentletIds` and `query` properties are present, the operation will perform the selected action on all contentlets indicated in both. Note that this will lead to the workflow action being performed on the same contentlet twice, if it appears in both.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FireBulkActionsForm'
        required: true
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOutput'
        '400':
          description: Bad request
        '415':
          description: Unsupported Media Type
  /api/v1/workflow/contentlet/actions/bulk/fire:
    put:
      tags:
      - Workflow
      summary: Perform workflow actions on bulk content
      description: 'Fires a workflow action on multiple contentlets identified either by a Lucene ''query'' or an explicit ''contentletIds'' list. If both are supplied, ''query'' wins and ''contentletIds'' is ignored.


        **Scheme association is enforced.** Contentlets whose workflow scheme does not own the supplied ''workflowActionId'' are skipped — they are not processed and are counted in ''skippedCount'' on the response, with a ''skipReason'' explaining the mismatch. When *every* input contentlet is skipped, the endpoint returns 422. To bypass scheme association checks (e.g. for System Workflow actions like Move on content from a custom scheme), use PUT /api/v1/workflow/actions/{actionId}/fire instead.


        ⚠️ **Important contract notes:**


        - `contentletIds` despite its name expects **inodes**, not identifiers. Passing identifiers results in a silent no-op with no error.

        - `additionalParams` must be present, even when empty (`{}`). Omitting it returns a `500` NPE.

        - The endpoint is **not step-aware**: if the action is not valid in a contentlet''s current step, the input is dropped silently (no `fails[]` entry). Verify post-fire state via `POST /api/content/_search`.

        - `PUT /api/v1/workflow/contentlet/actions/bulk/fire` and `POST /api/v1/workflow/contentlet/actions/_bulkfire` behave identically; `_bulkfire` streams via SSE.

        - For batches larger than a few contentlets, the synchronous response can exceed common client timeouts (e.g. ~15 s for the MCP sandbox). The server-side work typically completes; verify with `_search`.'
      operationId: putBulkActionsFire
      requestBody:
        description: See FireBulkActionsForm for full field-level docs. Either 'query' OR 'contentletIds' is required (not both); 'contentletIds' is a list of contentlet **inodes** (not identifiers, despite the property name). 'workflowActionId' must be a workflow action UUID — discover via GET /api/v1/workflow/schemes/{schemeId}/actions or GET /api/v1/workflow/contentlet/{inode}/actions. To pass a target path to a Move actionlet, set 'additionalParams.additionalParamsMap._path_to_move'.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FireBulkActionsForm'
        required: true
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Success — at least one contentlet processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityBulkActionsResultView'
        '400':
          description: Bad request
        '415':
          description: Unsupported Media Type
        '422':
          description: Whole batch skipped — none of the input contentlets are on a workflow scheme that owns the supplied 'workflowActionId'.
