openapi: 3.2.0
info:
  title: dotCMS REST Workflow API
  version: '3'
  description: Endpoints that perform operations related to workflows.
servers:
- url: /
  description: dotCMS Server
tags:
- name: Workflow
  description: Endpoints that perform operations related to workflows.
  externalDocs:
    description: Additional Workflow API information
    url: https://www.dotcms.com/docs/latest/workflow-rest-api
paths:
  /api/v1/report-issue:
    post:
      tags:
      - Workflow
      summary: Report a dotCMS UI issue
      description: Creates a Bug contentlet in the configured upstream reporting dotCMS instance.
      operationId: reportIssue
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FormDataMultiPart'
      responses:
        '200':
          description: Issue reported
          content:
            application/json: {}
        '400':
          description: Invalid report payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityView'
        '502':
          description: Reporting service unavailable or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityView'
  /api/v1/workflow/actions/separator:
    post:
      tags:
      - Workflow
      summary: Creates workflow action separator
      description: Creates a [workflow action] separator(https://www.dotcms.com/docs/latest/managing-workflows#Actions) from the properties specified in the payload. Returns the created workflow action.
      operationId: addSeparatorAction
      requestBody:
        description: 'Body consists of a JSON object containing a [workflow action](https://www.dotcms.com/docs/latest/managing-workflows#Actions) form. This includes the following properties:


          | Property | Type | Description |

          |-|-|-|

          | `schemeId` | String | The [workflow scheme](https://www.dotcms.com/docs/latest/managing-workflows#Schemes) under which the action will be created. |

          | `stepId` | String |  The [workflow step](https://www.dotcms.com/docs/latest'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowActionSeparatorForm'
        required: true
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Workflow action created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAction'
        '400':
          description: Bad request
        '415':
          description: Unsupported Media Type
  /api/v1/workflow/steps:
    post:
      tags:
      - Workflow
      summary: Add a new workflow step
      description: 'Creates a workflow step.


        Returns an object representing the step.'
      operationId: postAddWorkflowStep
      requestBody:
        description: "Body consists of a JSON object containing a workflow step update form. This includes the following properties:\n\n| Property | Type | Description |\n|-|-|-|\n| `schemeId` | String | The identifier of the [workflow scheme](https://www.dotcms.com/docs/latest/managing-workflows#Schemes) to which the step will be added. |\n| `stepName` | String | The name of the workflow step. |\n| `enableEscalation` | Boolean | Determines whether a step is capable of automatic escalation to the next step. (Read more about [schedule-enabled workflows](https://www.dotcms.com/docs/latest/schedule-enabled-workflow).) |\n| `escalationAction` | String | The identifier of the workflow action to execute on automatic escalation. **Must be an empty string (`\"\"`) when `enableEscalation: false`** — `null` or omitting the key returns `400 \"may not be null\"`. |\n| `escalationTime` | String | The time, in seconds, before the workflow automatically escalates. |\n| `stepResolved` | Boolean | If true, any content which enters this workflow step will be considered resolved.\nContent in a resolved step will not appear in the workflow queues of any users.\n |\n\n"
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStepAddForm'
        required: true
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Created workflow step successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityWorkflowStepView'
        '400':
          description: Bad request
        '415':
          description: Unsupported Media Type
  /api/v1/workflow/schemes/{schemeId}/copy:
    post:
      tags:
      - Workflow
      summary: Copy a workflow scheme
      description: 'Copy a workflow scheme.


        A name for the new scheme may be provided either by parameter or by POST body property; if no name is supplied, the name will be that of the copied workflow scheme with the current Unix epoch timestamp integer appended.


        Returns copied workflow scheme on success.'
      operationId: postCopyScheme
      parameters:
      - name: schemeId
        in: path
        description: 'Identifier of workflow scheme.


          Example value: `d61a59e1-a49c-46f2-a929-db2b4bfa88b2` (Default system workflow)'
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: 'Name of new scheme from copy.


          Note: A name with a length less than 2 characters or greater than 100 may require renaming before certain actions, such as archiving, can be taken on it.'
        schema:
          type: string
      requestBody:
        description: "Body consists of a `name` property; an alternate way to supply the name of the new scheme, instead of parameter.\n\n Name supplied this way must be at minimum 2 and at maximum 100 characters in length."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCopyForm'
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Copied workflow scheme successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityWorkflowSchemeView'
        '400':
          description: Bad request
        '404':
          description: Workflow scheme not found
        '415':
          description: Unsupported Media Type
  /api/v1/workflow/actions/{actionId}:
    get:
      tags:
      - Workflow
      summary: Find action by ID
      description: Returns a workflow action object.
      operationId: getWorkflowActionByActionId
      parameters:
      - name: actionId
        in: path
        description: 'Identifier of the workflow action to return.


          Example value: `b9d89c80-3d88-4311-8365-187323c96436` (Default system workflow "Publish" action)'
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Action returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityWorkflowActionView'
        '404':
          description: Workflow action not found
    put:
      tags:
      - Workflow
      summary: Update an existing workflow action
      description: 'Updates a workflow action based on the payload properties.


        Returns updated workflow action.'
      operationId: putSaveActionsByWorkflowActionForm
      parameters:
      - name: actionId
        in: path
        description: 'Identifier of workflow action to update.


          Example value: `b9d89c80-3d88-4311-8365-187323c96436` (Default system workflow "Publish" action)'
        required: true
        schema:
          type: string
      requestBody:
        description: 'Body consists of a JSON object containing the same form data as used above in `POST /v1/workflow/actions`. However, this endpoint uses the form''s properties differently, as noted below:


          | Property | Type | Description |

          |-|-|-|

          | `schemeId` | String | The [workflow scheme](https://www.dotcms.com/docs/latest/managing-workflows#Schemes) under which the action will be created. |

          | `actionName` | String | The name of the workflow action. Multiple actions of the same name can coexist with different identifiers.  |

          | `whoCanUse` | List of Strings | A list of identifiers representing [users](https://www.dotcms.com/docs/latest/user-management), [role keys](https://www.dotcms.com/docs/latest/adding-roles), or [other user categories](https://www.dotcms.com/docs/latest/managing-workflows#ActionWho) allowed to use this action. This list can be empty. |

          | `actionIcon` | String | The icon to associate with the action. Example: `workflowIcon`.  |

          | `actionCommentable` | Boolean | Whether this action supports comments.  |

          | `showOn` | List of Strings | List defining under which of the eight valid [workflow states](https://www.dotcms.com/docs/latest/managing-workflows#ActionShow) the action is visible. States must be specified uppercase, such as `NEW` or `LOCKED`. There is no single state for ALL; each state must be listed. |

          | `actionNextStep` | String | The identifier of the step to enter after performing the action; `currentstep` is also a valid value. |

          | `actionNextAssign` | String | A user identifier or role key (such as `CMS Anonymous`) to serve as the  default entry in the assignment dropdown. |

          | `actionCondition` | String | [Custom Velocity code](https://www.dotcms.com/docs/latest/managing-workflows#ActionAssign) to be executed along with the action. |

          | `actionAssignable` | Boolean | Whether this action can be assigned.  |

          | `actionRoleHierarchyForAssign` | Boolean | If true, non-administrators cannot assign tasks to administrators.  |

          | `metadata` | Object | Optional. Additional metadata to include in the action definition. |

          | `actionId` | String | Omit; not used in this endpoint. |

          | `stepId` | String | Omit; not used in this endpoint. |


          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowActionForm'
        required: true
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Updated workflow action successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityWorkflowActionView'
        '400':
          description: Bad request
        '415':
          description: Unsupported Media Type
    delete:
      tags:
      - Workflow
      summary: Delete a workflow action
      description: 'Deletes a workflow action from all steps in which it appears.


        Returns "Ok" on success.'
      operationId: deleteWorkflowActionByActionId
      parameters:
      - name: actionId
        in: path
        description: Identifier of the workflow action to delete.
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Workflow action deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityStringView'
        '404':
          description: Workflow action not found
  /api/v1/workflow/steps/{stepId}/actions/{actionId}:
    get:
      tags:
      - Workflow
      summary: Find a workflow action within a step
      description: Returns a workflow action if it exists within a specific step.
      operationId: getWorkflowActionByStepActionId
      parameters:
      - name: stepId
        in: path
        description: 'Identifier of a workflow step.


          Example value: `ee24a4cb-2d15-4c98-b1bd-6327126451f3` (Default system workflow "Draft" step)'
        required: true
        schema:
          type: string
      - name: actionId
        in: path
        description: 'Identifier of a workflow action.


          Example value: `b9d89c80-3d88-4311-8365-187323c96436` (Default system workflow "Publish" action)'
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Action returned successfully from step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityWorkflowActionView'
        '404':
          description: Workflow action not found within specified step
    delete:
      tags:
      - Workflow
      summary: Remove a workflow action from a step
      description: 'Deletes an action from a single workflow step.


        Returns "Ok" on success.


        If the action exists on other steps, removing it from one step will not delete the action outright.'
      operationId: deleteWorkflowActionFromStepByActionId
      parameters:
      - name: actionId
        in: path
        description: Identifier of the workflow action to remove.
        required: true
        schema:
          type: string
      - name: stepId
        in: path
        description: Identifier of the step containing the action.
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Workflow action removed from step successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityStringView'
        '404':
          description: Workflow action not found
  /api/v1/workflow/actionlets/{actionletId}:
    delete:
      tags:
      - Workflow
      summary: Remove an actionlet from a workflow action
      description: 'Removes an actionlet, or sub-action, from a workflow action. This deletes only the actionlet''s binding to the action utilizing it, and leaves the actionlet category intact.


        To find the identifier, you can call `GET /workflow/actions/{actionId}/actionlets`.


        Returns "Ok" on success.'
      operationId: deleteWorkflowActionletFromAction
      parameters:
      - name: actionletId
        in: path
        description: Identifier of the actionlet to delete.
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Workflow actionlet deleted from action successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityStringView'
        '404':
          description: Workflow action not found
  /api/v1/workflow/schemes/{schemeId}:
    put:
      tags:
      - Workflow
      summary: Update a workflow scheme
      description: 'Updates a workflow scheme.


        Returns updated scheme on success.'
      operationId: putUpdateWorkflowScheme
      parameters:
      - name: schemeId
        in: path
        description: 'Identifier of workflow scheme.


          Example value: `d61a59e1-a49c-46f2-a929-db2b4bfa88b2` (Default system workflow)'
        required: true
        schema:
          type: string
      requestBody:
        description: 'The request body consists of the following three properties:


          | Property | Type | Description |

          |-|-|-|

          | `schemeName` | String | The workflow scheme''s name. |

          | `schemeDescription` | String | A description of the scheme. |

          | `schemeArchived` | Boolean | If `true`, the scheme will be be placed in an archived state. |

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowSchemeForm'
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Updated workflow scheme successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityStringView'
        '400':
          description: Bad request
        '404':
          description: Workflow scheme not found.
        '415':
          description: Unsupported Media Type
    delete:
      tags:
      - Workflow
      summary: Delete a workflow scheme
      description: 'Deletes a workflow scheme


        Scheme must already be in an archived state.


        Returns deleted workflow scheme on success.'
      operationId: deleteWorkflowSchemeById
      parameters:
      - name: schemeId
        in: path
        description: Identifier of workflow scheme to delete.
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Workflow scheme deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityWorkflowSchemeView'
        '404':
          description: Workflow scheme not found
  /api/v1/workflow/steps/{stepId}:
    get:
      tags:
      - Workflow
      summary: Retrieves a workflow step
      description: Returns a workflow step by identifier.
      operationId: getFindWorkflowStepById
      parameters:
      - name: stepId
        in: path
        description: 'Identifier of the step to retrieve.


          Example: `ee24a4cb-2d15-4c98-b1bd-6327126451f3` (Default system workflow Draft step)'
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Found workflow step successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityWorkflowStepView'
        '400':
          description: Bad request
        '404':
          description: Workflow step not found.
    put:
      tags:
      - Workflow
      summary: Update an existing workflow step
      description: 'Updates a workflow step.


        Returns an object representing the updated step.'
      operationId: putUpdateWorkflowStepById
      parameters:
      - name: stepId
        in: path
        description: 'Identifier of the step to update.


          Example: `ee24a4cb-2d15-4c98-b1bd-6327126451f3` (Default system workflow Draft step)'
        required: true
        schema:
          type: string
      requestBody:
        description: "Body consists of a JSON object containing a workflow step update form. This includes the following properties:\n\n| Property | Type | Description |\n|-|-|-|\n| `stepOrder` | Integer | The position of the step within the [workflow scheme](https://www.dotcms.com/docs/latest/managing-workflows#Schemes), with `0` being the first. |\n| `stepName` | String | The name of the workflow step. |\n| `enableEscalation` | Boolean | Determines whether a step is capable of automatic escalation to the next step. (Read more about [schedule-enabled workflows](https://www.dotcms.com/docs/latest/schedule-enabled-workflow).) |\n| `escalationAction` | String | The identifier of the workflow action to execute on automatic escalation. |\n| `escalationTime` | String | The time, in seconds, before the workflow automatically escalates. |\n| `stepResolved` | Boolean | If true, any content which enters this workflow step will be considered resolved.\nContent in a resolved step will not appear in the workflow queues of any users.\n |\n\n"
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStepUpdateForm'
        required: true
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Updated workflow step successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityWorkflowStepView'
        '400':
          description: Bad request
        '415':
          description: Unsupported Media Type
    delete:
      tags:
      - Workflow
      summary: Delete a workflow step
      description: 'Deletes a step from a workflow scheme.


        Returns the deleted workflow step object.'
      operationId: deleteWorkflowStepById
      parameters:
      - name: stepId
        in: path
        description: Identifier of a workflow step to delete.
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Workflow step deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityWorkflowStepView'
        '404':
          description: Workflow action not found
  /api/v1/workflow/system/actions/{identifier}:
    delete:
      tags:
      - Workflow
      summary: Delete default system action binding by action id
      description: 'Deletes a default system action binding.


        Returns the deleted system action object.


        This method is minimally destructive, as it neither deletes a workflow action, nor removes any system action category. Instead, it dissolves the association between the two, which can be re-established any time.


        To find a suitable identifier, you can use `GET /system/actions/{workflowActionId}` and find it in the immediate `identifier` property of any of the objects returned in the entity.'
      operationId: deleteSystemActionByActionId
      parameters:
      - name: identifier
        in: path
        description: 'Identifier of the system action mapping to delete.


          Example value: `59995336-187e-442a-b398-04b9f137eabd` (Demo starter binding that maps `DELETE` system action to the "Destroy" workflow action for the Blog content type)'
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: System action binding deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntitySystemActionWorkflowActionMapping'
        '404':
          description: Workflow action not found
  /api/v1/workflow/actions/{actionId}/condition:
    get:
      tags:
      - Workflow
      summary: Find condition by action ID
      description: 'Returns a string representing the "condition" on the selected action.


        More specifically: if the workflow action has anything in its Custom Code field, the result is evaluated as Velocity, and the output is returned.'
      operationId: getWorkflowConditionByActionId
      parameters:
      - name: actionId
        in: path
        description: 'Identifier of a workflow action to check for condition.


          Example value: `b9d89c80-3d88-4311-8365-187323c96436` (Default system workflow "Publish" action)'
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Condition returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityStringView'
        '404':
          description: Workflow action not found
  /api/v1/workflow/schemes/{schemeIdOrVariable}/export:
    get:
      tags:
      - Workflow
      summary: Export a workflow scheme
      description: 'Export a workflow scheme.


        Returns the full workflow scheme, along with steps, actions, permissions, etc., on success.'
      operationId: getExportScheme
      parameters:
      - name: schemeIdOrVariable
        in: path
        description: Identifier or variable name of the workflow scheme to export.
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Invalid User
        '403':
          description: Forbidden
        '406':
          description: Not Acceptable
        '500':
          description: Internal Server Error
        '200':
          description: Exported workflow scheme successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityWorkflowSchemeView'
              example:
                entity:
                  permissions:
                  - bitPermission: false
                    id: 0
                    individualPermission: true
                    inode: string
                    permission: 0
                    roleId: string
                    type: string
                  workflowObject:
                    actionClassParams:
                    - actionClassId: string
                      id: null
                      key: string
                      value: null
                    actionClasses:
                    - actionId: string
                      actionlet:
                        actionClass: string
                        howTo: string
                        localizedHowto: string
                        localizedName: string
                        name: string
                        nextStep: null
                        parameters:
                        - defaultValue: ''
                          displayName: string
                          key: string
                          required: false
                      clazz: string
                      id: string
                      name: string
                      order: 0
                    actionSteps:
                    - actionId: string
                      actionOrder: '0'
                      stepId: string
                    actions:
                    - assignable: false
                      commentable: false
                      condition: ''
                      icon: string
                      id: string
                      metadata: null
                      name: string
                      nextAssign: string
                      nextStep: string
                      nextStepCurrentStep: true
                      order: 0
                      owner: null
                      roleHierarchyForAssign: false
                      schemeId: string
                      showOn: []
                    schemeSystemActionWorkflowActionMappings:
                    - identifier: string
                      owner:
                        archived: false
                        creationDate: 1723806880187
                        defaultScheme: false
                        description: string
                        entryActionId: null
                        id: string
                        mandatory: false
                        modDate: 1723796816309
                        name: string
                        system: false
                        variableName: string
                      systemAction: string
                      workflowAction:
                        assignable: false
                        commentable: false
                        condition: ''
                        icon: string
                        id: string
                        metadata: null
                        name: string
                        nextAssign: string
                        nextStep: string
                        nextStepCurrentStep: true
                        order: 0
                        owner: null
                        roleHierarchyForAssign: false
                        schemeId: string
                        showOn: []
                      ownerContentType: false
                      ownerScheme: true
                    schemes:
                    - archived: false
                      creationDate: 1723806880187
                      defaultScheme: false
                      description: string
                      entryActionId: null
                      id: string
                      mandatory: false
                      modDate: 1723796816309
                      name: string
                      system: false
                      variableName: string
                    steps:
                    - creationDate: 1723806894533
                      enableEscalation: false
                      escalationAction: null
                      escalationTime: 0
                      id: string
                      myOrder: 0
                      name: string
                      resolved: false
                      schemeId: string
                    version: string
                errors: []
                i18nMessagesMap: {}
                messages: []
                pagination: null
                permissions: []
        '400':
          description: Bad request
        '404':
          description: Workflow scheme not found
  /api/v1/workflow/actionlets:
    get:
      tags:
      - Workflow
      summary: Find all workflow actionlets
