          type: string
          description: Expiration date, in the content type's configured date format.
        expireTime:
          type: string
          description: Expiration time, in the content type's configured time format.
        neverExpire:
          type: string
          description: Set to 'true' to mark the content as never expiring.
        whereToSend:
          type: string
          description: Push-publishing target environment(s) for a 'Push Publish' action.
        filterKey:
          type: string
          description: Push-publishing filter key for a 'Push Publish' action.
        query:
          type: string
          description: Lucene query selecting the content to act on, as an alternative to 'contentlet'.
        pathToMove:
          type: string
