          description: Per-content individual permissions to apply, keyed by permission type (READ, WRITE, PUBLISH, etc.) to a list of user/role IDs.
        iwantTo:
          type: string
        contentlet:
          type: object
          additionalProperties:
            type: object
            description: 'The contentlet to create or edit, as a flat map of field-variable names to values. Polymorphic: the allowed fields depend on the content type.


              **System fields (all content):**

              - `contentType` *(string)* — the content type''s variable name (e.g. ''webPageContent''). Required when creating.

              - `languageId` *(number)* — language ID; defaults to the system default language when omitted.

              - `contentHost` *(string)* — host (site) **identifier** the content belongs to, **or** `hostFolder` *(string)* — a folder **identifier**. Supply one of these.

              - `inode` / `identifier` *(string)* — include the existing identifier (and optionally inode) to edit existing content; omit both to create new.


              ⚠️ Do **not** set `host` — use `contentHost` (host id) or `hostFolder` (folder id) instead.


              **Host defaulting (common wrong-host trap):** if you omit `contentHost`/`hostFolder` when creating, the content does NOT go to the current/default site — it inherits the **content type''s own host**, which is `SYSTEM_HOST` unless the type was explicitly created on a site. So content of a `SYSTEM_HOST` content type silently lands on `SYSTEM_HOST`, where it is invisible to another site''s URL-maps and to host-scoped searches (`+conHost:<siteId>`). Always pass `contentHost:<siteId>` (the site **identifier UUID**, not the hostname) to place content on a specific site.


              **Constant fields are content-type configuration, not contentlet data.** Fields whose `clazz` is `ImmutableConstantField` are shared by the content type. Keys for them in this `contentlet` map are silently ignored even when the workflow response is HTTP 200/live. For example, a WIDGET''s `widgetCode` must be written to the field''s `values` property via the content-type field API, not included in a widget contentlet.


              **Pages (`contentType: ''htmlpageasset''`)** additionally use:

              - `title` *(string)* — the page title.

              - `url` *(string)* — the page name (the last URL segment) within `hostFolder`.

              - `template` *(string)* — identifier of the template to render the page.

              - `cachettl` *(number)* — page cache time-to-live in seconds.

              - `sortOrder` *(number)* — sort order within the folder.


              Note: there is no dedicated page-create endpoint — pages are created by firing an action with an `htmlpageasset` contentlet.'
            example:
              contentType: htmlpageasset
              languageId: 1
              hostFolder: 48190c8c-42c4-46af-8d1a-0cd5db894797
              title: My Page
              url: my-page
              template: 8e63a9c0-...
              cachettl: 15
              sortOrder: 0
          description: 'The contentlet to create or edit, as a flat map of field-variable names to values. Polymorphic: the allowed fields depend on the content type.


            **System fields (all content):**

            - `contentType` *(string)* — the content type''s variable name (e.g. ''webPageContent''). Required when creating.

