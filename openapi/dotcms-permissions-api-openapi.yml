    UpdateAssetPermissionsView:
      required:
      - asset
      - inheritanceBroken
      - message
      - permissionCount
      type: object
      properties:
        message:
          type: string
          description: Success message describing the operation result
          example: Permissions saved successfully
        permissionCount:
          type: integer
          description: Number of permission entries saved during this operation
          format: int32
          example: 5
        inheritanceBroken:
          type: boolean
          description: Whether permission inheritance was broken during this operation. True if the asset was previously inheriting permissions from its parent.
          example: true
        asset:
          $ref: '#/components/schemas/AssetPermissionsView'
        cascadeWarnings:
          type: array
          description: Warnings from cascade operations that partially failed. Present only when cascade was requested and some role cascades failed.
          example:
          - 'Failed to trigger cascade for role xyz123: Connection timeout'
          items:
            type: string
            description: Warnings from cascade operations that partially failed. Present only when cascade was requested and some role cascades failed.
            example: '["Failed to trigger cascade for role xyz123: Connection timeout"]'
    AssetPermissionsView:
      required:
      - assetId
      - assetType
      - canAddChildren
      - canEdit
      - canEditPermissions
      - inheritanceMode
      - isParentPermissionable
      - permissions
      type: object
      properties:
        assetId:
          type: string
          description: Asset identifier
          example: 48190c8c-42c4-46af-8d1a-0cd5db894797
        assetType:
          type: string
          description: Asset type
          example: FOLDER
          enum:
          - INDIVIDUAL
          - HOST
          - FOLDER
          - CONTAINER
          - TEMPLATE
          - TEMPLATE_LAYOUT
          - LINK
          - CONTENT
          - PAGE
          - CONTENT_TYPE
          - STRUCTURE
          - CATEGORY
          - RULE
        inheritanceMode:
          type: string
          description: Permission inheritance mode
          example: INDIVIDUAL
          enum:
          - INHERITED
          - INDIVIDUAL
        canEditPermissions:
          type: boolean
          description: Whether the requesting user can edit permissions on this asset
          example: true
        canEdit:
          type: boolean
          description: Whether the requesting user can edit this asset
          example: true
        canAddChildren:
          type: boolean
          description: Whether the requesting user can add children to this asset
          example: true
        parentAssetId:
          type: string
          description: Parent asset identifier (null if no parent or at root level)
          example: abc-123-def-456
        permissions:
          type: array
          properties:
            empty:
              type: boolean
            first:
              $ref: '#/components/schemas/RolePermissionView'
            last:
              $ref: '#/components/schemas/RolePermissionView'
          description: Paginated list of role permissions assigned to this asset
          items:
            $ref: '#/components/schemas/RolePermissionView'
        isParentPermissionable:
          type: boolean
          description: Whether this asset can have child permissionables (e.g., hosts and folders)
          example: true
      description: The updated asset with its new permission assignments
    RolePermissionView:
      required:
      - individual
      - inherited
      - roleId
      - roleName
      type: object
      properties:
        roleId:
          type: string
          description: Role identifier
          example: abc-123-def-456
        roleName:
          type: string
          description: Role display name
          example: CMS Administrator
        inherited:
          type: boolean
          description: Whether permissions are inherited from a parent asset
          example: false
        individual:
          uniqueItems: true
          type: array
          properties:
            empty:
              type: boolean
          description: Individual permission levels assigned directly to this role on the asset
          example:
          - READ
          - WRITE
          - PUBLISH
          items:
            type: string
            description: Individual permission levels assigned directly to this role on the asset
            example: '["READ","WRITE","PUBLISH"]'
            enum:
            - READ
            - USE
            - EDIT
            - WRITE
            - PUBLISH
            - EDIT_PERMISSIONS
            - CAN_ADD_CHILDREN
        inheritable:
          type: object
          properties:
            empty:
              type: boolean
          additionalProperties:
            uniqueItems: true
            type: array
            description: Inheritable permissions by scope (only for parent permissionables). Keys are permission scopes (HOST, FOLDER, CONTENT, etc.), values are permission types
            example:
              FOLDER:
              - READ
              - WRITE
              CONTENT:
              - READ
            items:
              type: string
              description: Inheritable permissions by scope (only for parent permissionables). Keys are permission scopes (HOST, FOLDER, CONTENT, etc.), values are permission types
              example: '{"FOLDER":["READ","WRITE"],"CONTENT":["READ"]}'
              enum:
              - READ
              - USE
              - EDIT
              - WRITE
              - PUBLISH
              - EDIT_PERMISSIONS
              - CAN_ADD_CHILDREN
          description: Inheritable permissions by scope (only for parent permissionables). Keys are permission scopes (HOST, FOLDER, CONTENT, etc.), values are permission types
          example:
            FOLDER:
            - READ
            - WRITE
            CONTENT:
            - READ
    UserPermissionAssetView:
      required:
      - canEditPermissions
      - hostId
      - id
      - inheritsPermissions
      - name
      - path
      - permissions
      - type
      type: object
      properties:
        id:
          type: string
          description: Asset identifier (host identifier for HOST type, folder inode for FOLDER type)
          example: abc-123-def-456
        type:
          type: string
          description: Asset type
          example: HOST
          enum:
          - HOST
          - FOLDER
        name:
          type: string
          description: Asset name (hostname for HOST, folder name for FOLDER)
          example: demo.dotcms.com
        path:
          type: string
          description: Full path to the asset
          example: /demo.dotcms.com/application
        hostId:
          type: string
          description: Host identifier (same as id for HOST type, parent host for FOLDER type)
          example: abc-123-def-456
        canEditPermissions:
          type: boolean
          description: Whether the requesting user can edit permissions on this asset
          example: true
        inheritsPermissions:
          type: boolean
          description: Whether this asset inherits permissions from its parent
          example: false
        permissions:
          type: object
          properties:
            empty:
              type: boolean
          additionalProperties:
            uniqueItems: true
            type: array
            description: Map of permission types (INDIVIDUAL, HOST, FOLDER, etc.) to sets of permission level names (READ, WRITE, PUBLISH, EDIT_PERMISSIONS, CAN_ADD_CHILDREN)
            example:
              INDIVIDUAL:
              - READ
              - WRITE
              - PUBLISH
              HOST:
              - READ
            items:
              type: string
              description: Map of permission types (INDIVIDUAL, HOST, FOLDER, etc.) to sets of permission level names (READ, WRITE, PUBLISH, EDIT_PERMISSIONS, CAN_ADD_CHILDREN)
              example: '{"INDIVIDUAL":["READ","WRITE","PUBLISH"],"HOST":["READ"]}'
          description: Map of permission types (INDIVIDUAL, HOST, FOLDER, etc.) to sets of permission level names (READ, WRITE, PUBLISH, EDIT_PERMISSIONS, CAN_ADD_CHILDREN)
          example:
            INDIVIDUAL:
            - READ
            - WRITE
            - PUBLISH
            HOST:
            - READ
      description: The updated asset with new permission assignments
