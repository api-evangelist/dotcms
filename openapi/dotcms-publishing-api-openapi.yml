    RetryBundlesForm:
      required:
      - bundleIds
      type: object
      properties:
        bundleIds:
          type: array
          properties:
            empty:
              type: boolean
            first:
              type: string
            last:
              type: string
          description: List of bundle identifiers to retry
          example:
          - 01KJWNJM2C67DM56GHBJ4S7B89
          - 01KJWNJM2C67DM56GHBJ4S7B90
          items:
            type: string
            description: List of bundle identifiers to retry
            example: '["01KJWNJM2C67DM56GHBJ4S7B89","01KJWNJM2C67DM56GHBJ4S7B90"]'
        forcePush:
          type: boolean
          description: Force push to override existing content at endpoints. Automatically true for SUCCESS/SUCCESS_WITH_WARNINGS bundles.
          example: false
        deliveryStrategy:
          type: string
          description: 'Which endpoints to retry: ALL_ENDPOINTS sends to all, FAILED_ENDPOINTS sends only to previously failed endpoints. Case-sensitive: must be uppercase.'
          example: FAILED_ENDPOINTS
          enum:
          - ALL_ENDPOINTS
          - FAILED_ENDPOINTS
          default: ALL_ENDPOINTS
