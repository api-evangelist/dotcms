components:
  schemas:
    ResponseEntityViewMapStringObject:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntity'
        entity:
          type: object
          additionalProperties:
            type: object
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageEntity'
        i18nMessagesMap:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: array
          items:
            type: string
        pagination:
          $ref: '#/components/schemas/Pagination'
    SetHashForm:
      required:
      - fields
      - key
      type: object
      properties:
        key:
          type: string
        fields:
          type: object
          additionalProperties:
            type: object
    ErrorEntity:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
        fieldName:
          type: string
    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          format: int32
        perPage:
          type: integer
          format: int32
        totalEntries:
          type: integer
          format: int64
    SetForm:
      required:
      - key
      - value
      type: object
      properties:
        key:
          type: string
        value:
          type: object
    MessageEntity:
      type: object
      properties:
        message:
          type: string
