openapi: 3.2.0
info:
  title: dotCMS REST Page API
  version: '3'
  description: Page rendering, layout management, and content operations
servers:
- url: /
  description: dotCMS Server
tags:
- name: Page
  description: Page rendering, layout management, and content operations
  externalDocs:
    description: Additional Page API information
    url: https://www.dotcms.com/docs/latest/page-rest-api-layout-as-a-service-laas
paths:
  /api/v1/page/{pageId}/content:
    post:
      tags:
      - Page
      summary: Replace the content mapping of a page
      description: 'Replaces all container-to-contentlet assignments for the page (DEFAULT variant, or a named variant when ''variantName'' is provided). This is a full replacement, not a patch: omitting a container slot removes its content. The body is a bare JSON array of container entries; each entry maps one container instance to its ordered list of contentlets. Duplicate entries are merged automatically. To build the payload, fetch GET /api/v1/page/json/{uri} first (faster than /render — no Velocity execution): use ''page.containers'' for the path-based identifier and ''page.layout.body.rows[].columns[].containers[]'' for the uuid of each slot.'
      operationId: addContentToPage
      parameters:
      - name: pageId
        in: path
        description: Identifier of the HTML Page to update
        required: true
        schema:
          type: string
      - name: variantName
        in: query
        description: Variant name for A/B testing (defaults to DEFAULT)
        schema:
          type: string
      requestBody:
        description: 'Array of container entries. Full replacement: omitting a slot removes its content from the page.'
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PageContainerEntryView'
            example:
            - identifier: //demo.dotcms.com/application/containers/default/
              uuid: '10'
              contentletsId:
              - 7b33f0b474ba3b82c3a908b81dce5e2c
        required: true
      responses:
        '200':
          description: Contentlets saved successfully
          content:
            application/json:
              example:
                entity:
                - containerId: some-container-id
                  contentletId: some-contentlet-id
                  uuid: some-uuid
                - containerId: other-container-id
                  contentletId: other-contentlet-id
                  uuid: other-uuid
                errors: []
                i18nMessagesMap: {}
                messages: []
                pagination: null
                permissions: []
        '400':
          description: Bad request or data exception
        '409':
          description: Conflict — net content loss exceeds the configured threshold; refresh and retry
  /api/v1/page/{pageId}/languages:
    get:
      tags:
      - Page
      summary: Check page availability by language (deprecated)
      description: Returns all available languages in dotCMS, each with a flag indicating whether the page is available in that language. This endpoint is deprecated -- use the more generic ContentResource.getExistingLanguagesForContent endpoint instead.
      operationId: checkPageLanguageVersions
      parameters:
      - name: pageId
        in: path
        description: Identifier of the HTML Page to check language versions for
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Language availability list retrieved successfully (deprecated endpoint)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityLanguagesForPageView'
        '401':
          description: Authentication required
        '404':
          description: Page not found
      deprecated: true
  /api/v1/page/_check-permission:
    post:
      tags:
      - Page
      summary: Check user permission on a page
      description: Returns true if the page exists and the current user has the specified permission type over it. Supports both regular HTML pages and URL-mapped content. The permission type defaults to READ if not specified.
      operationId: checkPagePermission
      requestBody:
        description: Form with page path, host ID, language ID, and permission type to check
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/PageCheckPermissionForm'
        required: true
      responses:
        '200':
          description: Permission check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityBooleanView'
        '401':
          description: Authentication required
        '404':
          description: Page not found at the specified path
  /api/v1/page/copyContent:
    put:
      tags:
      - Page
      summary: Copy a contentlet on a page
      description: Creates a copy of a contentlet that is part of the multi-tree on a page. The contentlet must exist and be associated with the page specified in the form. Returns the copied contentlet as a map of properties.
      operationId: copyPageContent
      requestBody:
        description: Form containing the contentlet and page information for the copy operation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyContentletForm'
        required: true
      responses:
        '200':
          description: Contentlet copied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityMapView'
        '400':
          description: Bad request - form is required or contentlet not found
        '401':
          description: Authentication required
        '403':
          description: User does not have required permissions
  /api/v1/page/{pageId}/_deepcopy:
    put:
      tags:
      - Page
      summary: Deep copy a page and all its content
      description: 'Creates a deep copy of a page: (1) creates a copy of the page itself, and (2) for each contentlet in the multi-tree related to the page, creates a copy. Returns the copied page as a map of properties.'
      operationId: deepCopyPage
      parameters:
      - name: pageId
        in: path
        description: Identifier of the HTML Page to deep copy
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Page deep copied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityMapView'
        '401':
          description: Authentication required
        '403':
          description: User does not have required permissions
        '404':
          description: Page not found
  /api/v1/page/actions:
    post:
      tags:
      - Page
      summary: Find available workflow actions for a page
      description: Returns the page data along with the list of available workflow actions for the specified page path. Supports both regular HTML pages and URL-mapped content. The response includes the page contentlet properties and the workflow actions that the current user can perform.
      operationId: findAvailablePageActions
      requestBody:
        description: Form with page path, host ID, language ID, and render mode for action lookup
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/FindAvailableActionsForm'
        required: true
      responses:
        '200':
          description: Available workflow actions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityPageWorkflowActionsView'
        '401':
          description: Authentication required
        '404':
          description: Page not found at the specified path and language
  /api/v1/page/{pageId}/content/tree:
    get:
      tags:
      - Page
      summary: Get the multi-tree content structure of a page
      description: Returns the multi-tree data associated with a page, which represents the mapping between containers, contentlets, and their positions on the page. Each entry includes the page ID, container ID, contentlet ID, relation type, tree order, personalization, and variant ID.
      operationId: getPageContentTree
      parameters:
      - name: pageId
        in: path
        description: Identifier of the HTML Page
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Content tree retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityMulitreeView'
        '401':
          description: Authentication required
        '403':
          description: User does not have required permissions
        '404':
          description: Page not found
  /api/v1/page/{pageId}/render/versions:
    get:
      tags:
      - Page
      summary: Get live and preview render versions of a page
      description: Returns the page render for both the live and preview (working) versions. Includes a boolean 'diff' flag indicating whether the live and preview versions differ.
      operationId: getPageRenderVersions
      parameters:
      - name: pageId
        in: path
        description: Identifier of the HTML Page
        required: true
        schema:
          type: string
      - name: langId
        in: query
        description: Language ID (defaults to the system default language)
        schema:
          type: string
      responses:
        '200':
          description: Page render versions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityPageLivePreviewVersionView'
        '401':
          description: Authentication required
        '403':
          description: User does not have required permissions
        '404':
          description: Page not found
  /api/v1/page/types:
    get:
      tags:
      - Page
      summary: Get content types associated with pages
      description: Returns all content types associated with pages, including both the base HTMLPAGE type and all content types with URL map patterns. Results are paginated and can be filtered and sorted.
      operationId: getPageContentTypes
      parameters:
      - name: filter
        in: query
        description: Filter text for content type names
        schema:
          type: string
          default: ''
      - name: page
        in: query
        description: Page number for pagination (zero-based)
        schema:
          type: integer
          format: int32
      - name: per_page
        in: query
        description: Number of results per page
        schema:
          type: integer
          format: int32
      - name: orderby
        in: query
        description: 'Field to order results by (default: UPPER(name))'
        schema:
          type: string
          default: UPPER(name)
      - name: direction
        in: query
        description: 'Sort direction: ASC or DESC (default: ASC)'
        schema:
          type: string
          default: ASC
      responses:
        '200':
          description: Page content types retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityPaginatedDataView'
        '401':
          description: Authentication required
        '403':
          description: User does not have required permissions
  /api/v1/page/{pageId}/personas:
    get:
      tags:
      - Page
      summary: Get personalized personas for a page
      description: Returns a paginated list of personas with a flag indicating whether each persona has been customized (personalized) on the specified page. Useful for identifying which personas have page-specific content variations.
      operationId: getPersonalizedPersonasOnPage
      parameters:
      - name: filter
        in: query
        description: Filter text to narrow persona results
        schema:
          type: string
      - name: page
        in: query
        description: Page number for pagination (zero-based)
        schema:
          type: integer
          format: int32
      - name: per_page
        in: query
        description: Number of results per page
        schema:
          type: integer
          format: int32
      - name: orderby
        in: query
        description: 'Field to order results by (default: title)'
        schema:
          type: string
          default: title
      - name: direction
        in: query
        description: 'Sort direction: ASC or DESC (default: ASC)'
        schema:
          type: string
          default: ASC
      - name: hostId
        in: query
        description: Host identifier to scope persona lookup
        schema:
          type: string
      - name: pageId
        in: path
        description: Identifier of the HTML Page
        required: true
        schema:
          type: string
      - name: respectFrontEndRoles
        in: query
        description: Whether to respect front-end roles for permission checks
        schema:
          type: boolean
      responses:
        '200':
          description: Personas with personalization flags retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityListPersonalizationPersonaPageView'
        '401':
          description: Authentication required
        '403':
          description: User does not have required permissions
        '404':
          description: Page not found
  /api/v1/page/_render-sources/{uri}:
    get:
      tags:
      - Page
      summary: Get render sources for a page
      description: 'Returns references only (path + identifier, no file content, no container code) mapping a rendered page to its source files. The page is identified by a URI path segment, exactly like `GET /api/v1/page/render/{uri}`.


        The URI must be a plain path (e.g. `index`, `about/team`). To address a specific site, use the `host_id` query parameter.


        Includes the page reference, theme VTL files, all containers referenced by the template (only content types actually placed under the applied persona/variant are included), and widget contentlets placed on the page.


        **Widget source field:**

        Each widget entry includes a `source` field:

        - `FILE` — the widget''s Velocity lives in a file asset; `path` and `identifier` are populated. Retrieve the VTL content via `GET /api/v2/assets`.

        - `CODE` — the widget''s Velocity is inline (in the content type''s `widgetCode` field and/or the contentlet''s own fields). No `path`/`identifier` are returned. Retrieve the content type definition via `GET /api/v1/contenttype/id/{contentTypeVar}` and the placed contentlet via `GET /api/v1/content/id/{contentletId}`.


        **Other source lookups:**

        - Theme folder files: `GET /api/v1/folder/sitename/{site}/uri/{uri}`

        - DB container code: `GET /api/v1/containers/working?containerId=&includeContentType=true`

        - FILE container VTL content: `GET /api/v2/assets`'
      operationId: getPageRenderSources
      parameters:
      - name: uri
        in: path
        description: Page URI path (e.g. 'index' or 'about/team'). Must be a plain path without an embedded host; use host_id to target a specific site.
        required: true
        schema:
          pattern: .*
          type: string
      - name: host_id
        in: query
        description: Explicit host identifier; if omitted the default site is used
        schema:
          type: string
      - name: language_id
        in: query
        description: Language identifier; defaults to the default language
        schema:
          type: string
      - name: persona_id
        in: query
        description: Persona contentlet identifier for personalization lookup
        schema:
          type: string
      - name: variantName
        in: query
        description: Variant name; defaults to DEFAULT
        schema:
          type: string
      - name: mode
        in: query
        description: 'Page mode: EDIT_MODE, PREVIEW_MODE, LIVE; defaults to PREVIEW_MODE'
        schema:
          type: string
      responses:
        '200':
          description: Render sources retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityPageRenderSourcesView'
        '400':
          description: Invalid request parameter (e.g. an unknown mode value)
        '403':
          description: User does not have READ permission on the page
        '404':
          description: Page not found, wrong language, or unknown host
  /api/v1/page/json/{uri}:
    get:
      tags:
      - Page
      summary: Get page metadata as JSON by URI
      description: 'Returns the metadata (the objects that make up an HTML Page) in JSON format based on the specified URI. If the URI maps to a Vanity URL, a 200 Forward returns the actual page metadata, while a 301/302 redirect returns an empty page JSON with the Vanity URL properties. Supports Time Machine via the publishDate parameter (ISO 8601 format).


        The URI must be a plain page path (no embedded host). To read a page on a NON-default site, pass the `host_id` query parameter (backend users only); without it the current/default site is used. The `//host/uri` path form is NOT supported.'
      operationId: getPageJsonByUri
      parameters:
      - name: uri
        in: path
        description: Path to the HTML Page or Vanity URL (e.g., 'about-us/locations/index'). Must be a plain path with no embedded host; use host_id to target a specific site.
        required: true
        schema:
          pattern: .*
          type: string
      - name: host_id
        in: query
        description: Explicit site to read against, given as a host identifier (UUID). Backend users only; if omitted the current/default site is used.
        schema:
          type: string
      - name: mode
        in: query
        description: Page mode for rendering (e.g., EDIT_MODE, PREVIEW_MODE, LIVE)
        schema:
          type: string
      - name: com.dotmarketing.persona.id
        in: query
        description: Persona identifier to render the page with personalization
        schema:
          type: string
      - name: language_id
        in: query
        description: Language ID for the page content
        schema:
          type: string
      - name: device_inode
        in: query
        description: Device inode for responsive rendering dimensions
        schema:
          type: string
      - name: publishDate
        in: query
        description: Time Machine date in ISO 8601 format to view page as it was at a specific point in time
        schema:
          type: string
      responses:
        '200':
          description: Page metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityEmptyPageView'
        '400':
          description: Bad request
        '401':
          description: Authentication required
        '403':
          description: User does not have required permissions
        '404':
          description: Page not found
  /api/v1/page/render/{uri}:
    get:
      tags:
      - Page
      summary: Get rendered page metadata by URI
      description: 'Returns the metadata of an HTML Page including its rendered HTML code and container content in JSON format based on the specified URI. If the URI maps to a Vanity URL, a 200 Forward returns the actual rendered page, while a 301/302 redirect returns an empty page JSON with Vanity URL properties. Supports Time Machine via the publishDate parameter (ISO 8601 format). For EMA (Enterprise Marketing Automation) requests, this may delegate to the JSON endpoint when the rendered attribute is not required.


        The URI must be a plain page path (no embedded host). To render a page on a NON-default site, pass the `host_id` query parameter (backend users only); without it the current/default site is used. The `//host/uri` path form is NOT supported.'
      operationId: getPageRenderByUri
      parameters:
      - name: uri
        in: path
        description: Path to the HTML Page or Vanity URL (e.g., 'about-us/locations/index'). Must be a plain path with no embedded host; use host_id to target a specific site.
        required: true
        schema:
          pattern: .*
          type: string
      - name: host_id
        in: query
        description: Explicit site to render against, given as a host identifier (UUID). Backend users only; if omitted the current/default site is used.
        schema:
          type: string
      - name: mode
        in: query
        description: Page mode for rendering (e.g., EDIT_MODE, PREVIEW_MODE, LIVE)
        schema:
          type: string
      - name: com.dotmarketing.persona.id
        in: query
        description: Persona identifier to render the page with personalization
        schema:
          type: string
      - name: language_id
        in: query
        description: Language ID for the page content
        schema:
          type: string
      - name: device_inode
        in: query
        description: Device inode for responsive rendering dimensions
        schema:
          type: string
      - name: publishDate
        in: query
        description: Time Machine date in ISO 8601 format to view page as it was at a specific point in time
        schema:
          type: string
      responses:
        '200':
          description: Rendered page retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityPageView'
        '400':
          description: Bad request
        '401':
          description: Authentication required
        '403':
          description: User does not have required permissions
        '404':
          description: Page not found
  /api/v1/page/renderHTML/{uri}:
    get:
      tags:
      - Page
      summary: Render page as raw HTML
      description: 'Returns the rendered HTML content of a page without the JSON metadata wrapper. Useful for retrieving the raw HTML output of a page for embedding or server-side rendering.


        The page is identified by a plain URI path (e.g. `index`, `about/team`). To render a page on a NON-default site, pass the `host_id` query parameter (backend users only); without it the current/default site is used. The `//host/uri` path form is NOT supported — the URI must not embed a host.'
      operationId: renderPageHtmlOnly
      parameters:
      - name: uri
        in: path
        description: Plain page URI path (e.g. 'index' or 'about/team'). Must not embed a host; use host_id to target a specific site.
        required: true
        schema:
          pattern: .*
          type: string
      - name: host_id
        in: query
        description: Explicit site to render against, given as a host identifier (UUID). Backend users only; if omitted the current/default site is used.
        schema:
          type: string
      - name: mode
        in: query
        description: 'Page mode for rendering (default: LIVE_ADMIN)'
        schema:
          type: string
          default: LIVE_ADMIN
      responses:
        '200':
          description: Page HTML rendered successfully
          content:
            application/html:
              schema:
                type: string
        '401':
          description: Authentication required
        '404':
          description: Page not found
  /api/v1/page/layout:
    post:
      tags:
      - Page
      summary: Saves a page template
      description: Handles saving of a page template using provided data. Method processes the request and returns HTTP response indicating a complete save operation.
      operationId: postPageLayout
      requestBody:
        description: POST body consists of a JSON object containing one property called 'PageForm', which contains a template layout for the page
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageForm'
        required: true
      responses:
        '200':
          description: Page template saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityTemplateView'
        '400':
          description: Bad request or data exception
        '404':
          description: Page not found
  /api/v1/page/{pageId}/layout:
    post:
      tags:
      - Page
      summary: Links template and page
      description: 'Takes a saved template and links it to an HTML page.


        Any pages with a template already linked will update with the new link.


        Otherwise a new template will be created without making any changes to previous templates.


        Returns the rendered page.'
      operationId: postPageLayoutHTMLLink
      parameters:
      - name: pageId
        in: path
        description: ID for the page will link to
        required: true
        schema:
          type: string
      - name: variantName
        in: query
        schema:
          type: string
      requestBody:
        description: 'POST body consists of a JSON object containing one property called ''PageForm'', which contains information about the layout of a page''s template '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageForm'
        required: true
      responses:
        '200':
          description: Page template linked to HTML and saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityPageView'
        '400':
          description: Bad request or data exception
        '404':
          description: Page not found
  /api/v1/page/search:
    get:
      tags:
      - Page
      summary: Search pages by path
      description: Returns all pages whose path matches the given filter. If the path starts with '//', the segment after the double-slash is treated as the site name for filtering. Results can be filtered to live versions only and/or pages from live sites only.
      operationId: searchPages
      parameters:
      - name: path
        in: query
        description: Path to filter pages by; prefix with '//' to include site name (e.g., '//demo.dotcms.com/about')
        required: true
        schema:
          type: string
      - name: live
        in: query
        description: If true, return only live versions; if false, return both live and working versions
        schema:
          type: boolean
      - name: onlyLiveSites
        in: query
        description: If true, filter results to only include pages from live sites
        schema:
          type: boolean
      responses:
        '200':
          description: Pages matching the search criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityContentletMapsView'
        '401':
          description: Authentication required
        '403':
          description: User does not have required permissions
  /api/v1/page/{pageId}/styles:
    put:
      tags:
      - Page
      summary: Update contentlet styles in a page
      description: Updates style properties for contentlets within containers on a specific page. Only updates the styleProperties field without modifying page structure.
      operationId: updateStyles
      parameters:
      - name: pageId
        in: path
        description: Page identifier
        required: true
        schema:
          type: string
      requestBody:
        description: List of containers with contentlet style updates. Each container includes its ID, UUID, and dynamic properties where contentlet IDs are keys with their style properties as values.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentWithStylesForm'
        required: true
      responses:
        '200':
          description: Contentlet styles updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityContentView'
        '400':
          description: Invalid request - empty container entries or invalid contentlet references
          content:
            application/json: {}
        '401':
          description: Unauthorized - authentication required
          content:
            application/json: {}
        '403':
          description: Forbidden - user does not have EDIT permission on the page
          content:
            application/json: {}
        '404':
          description: Page not found
          content:
            application/json: {}
components:
  schemas:
    ResponseEntityPageView:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntity'
        entity:
          $ref: '#/components/schemas/PageView'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageEntity'
        i18nMessagesMap:
          type: object
          additionalProperties:
            type: string
        permissions:
          type: array
          items:
            type: string
        pagination:
          $ref: '#/components/schemas/Pagination'
    ContentTypeEntryView:
      type: object
      properties:
        contentTypeVar:
          type: string
          description: Velocity variable name of the Content Type
        path:
          type: string
          description: Host-qualified path to the VTL file (FILE containers only)
        identifier:
          type: string
          description: File asset identifier of the VTL file (FILE containers only)
      description: Content types placed on the page for this container. DB entries contain only contentTypeVar; FILE entries also include path and identifier.
    ContentView:
      required:
      - containerId
      - contentletId
      - uuid
      type: object
      properties:
        containerId:
          type: string
          description: Container identifier
          example: //demo.dotcms.com/application/containers/default/
        uuid:
          type: string
          description: Container unique identifier (UUID)
        contentletId:
          type: string
          description: Contentlet identifier
        dotStyleProperties:
          type: object
          properties:
            empty:
              type: boolean
          additionalProperties:
            type: object
            description: Styles defined for the Contentlet
            example:
              color: '#FF0000'
              margin: 10px
          description: Styles defined for the Contentlet
          example:
