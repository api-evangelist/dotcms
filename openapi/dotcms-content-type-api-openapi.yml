      type: object
      properties:
        clazz:
          type: string
          description: 'Base type of the content type, as a case-insensitive base-type name: `CONTENT`, `WIDGET`, `FORM`, `FILEASSET`, `HTMLPAGE`, `PERSONA`, `VANITY_URL`, `KEY_VALUE`, or `DOTASSET`. Example: `"WIDGET"`.'
          example: WIDGET
          enum:
          - CONTENT
          - WIDGET
          - FORM
          - FILEASSET
          - HTMLPAGE
          - PERSONA
          - VANITY_URL
          - KEY_VALUE
          - DOTASSET
        name:
          type: string
          description: Display name of the content type.
        variable:
          type: string
          description: Velocity variable name (unique, alphanumeric, starts with a letter; auto-generated from 'name' if omitted).
        host:
          type: string
          description: Site identifier UUID this content type lives on, or the literal 'SYSTEM_HOST' (defaults to the default site).
        folder:
          type: string
          description: Folder identifier UUID, or the literal 'SYSTEM_FOLDER' (the default).
        description:
          type: string
          description: Description of the content type.
        defaultType:
          type: boolean
          description: Whether this is the default content type.
        fixed:
          type: boolean
          description: Whether the content type is fixed (system-managed).
        system:
          type: boolean
          description: Whether the content type is a system type.
        workflow:
          type: array
          description: 'Workflow scheme identifiers to associate with the content type, e.g. ["d61a59e1-a49c-46f2-a929-db2b4bfa88b2"] for the System Workflow. NOTE: this key is ''workflow'' (singular) in the REQUEST; GET responses return ''workflows'' (plural, array of objects) — rename the key when round-tripping.'
          items:
            type: string
        fields:
          type: array
          description: 'Fields that make up the content type, in order. Rows and columns are regular entries: ''ImmutableRowField'' begins a row, ''ImmutableColumnField'' begins a column, and subsequent content fields belong to the most-recent column.'
          items:
            $ref: '#/components/schemas/ContentTypeFieldView'
        metadata:
          type: object
          additionalProperties:
            type: object
            description: 'Content-type metadata. Known keys: ''CONTENT_EDITOR2_ENABLED'' (boolean), ''DOT_STYLE_EDITOR_SCHEMA'' (JSON string).'
          description: 'Content-type metadata. Known keys: ''CONTENT_EDITOR2_ENABLED'' (boolean), ''DOT_STYLE_EDITOR_SCHEMA'' (JSON string).'
        systemActionMappings:
          type: object
          additionalProperties:
            type: string
            description: Maps system actions (NEW, EDIT, PUBLISH, UNPUBLISH, ARCHIVE, UNARCHIVE, DELETE, DESTROY) to workflow action identifiers.
          description: Maps system actions (NEW, EDIT, PUBLISH, UNPUBLISH, ARCHIVE, UNARCHIVE, DELETE, DESTROY) to workflow action identifiers.
      description: 'A content-type object, posted directly (NOT wrapped in a ''contentType'' envelope). The endpoint also accepts an array of these objects to create several types in one call. Creating clazz `WIDGET` automatically adds `widgetTitle`, `widgetUsage`, `widgetCode`, and `widgetPreexecute`. `widgetCode` is an ImmutableConstantField: its shared code belongs in the field''s `values` property, not in individual widget contentlets.'
