components:
  schemas:
    FormDataMultiPart:
      type: object
      properties:
        contentDisposition:
          $ref: '#/components/schemas/ContentDisposition'
        entity:
          type: object
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        mediaType:
          type: object
          properties:
            type:
              type: string
            subtype:
              type: string
            parameters:
              type: object
              additionalProperties:
                type: string
            wildcardType:
              type: boolean
            wildcardSubtype:
              type: boolean
        messageBodyWorkers:
          $ref: '#/components/schemas/MessageBodyWorkers'
        parent:
          $ref: '#/components/schemas/MultiPart'
        providers:
          type: object
        bodyParts:
          type: array
          items:
            $ref: '#/components/schemas/BodyPart'
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/FormDataBodyPart'
        parameterizedHeaders:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ParameterizedHeader'
    VelocityWarningView:
      type: object
      properties:
        type:
          type: string
          description: The kind of warning.
          example: UNDEFINED_REFERENCE
          enum:
          - UNDEFINED_REFERENCE
          - NULL_METHOD_RESULT
          - INVALID_METHOD
          - NULL_SET
        message:
          type: string
          description: Human-readable description of the warning.
          example: Undefined reference '$noSuchVar' — renders as literal text in non-strict mode
        reference:
          type: string
          description: The reference or method expression that triggered the warning, when known.
          example: $noSuchVar
        line:
          type: integer
          description: 1-based line number where the reference appears, when Velocity reports it. Omitted when unavailable.
          format: int32
          example: 3
        column:
          type: integer
          description: 1-based column number where the reference appears, when Velocity reports it. Omitted when unavailable.
          format: int32
          example: 1
      description: A non-fatal Velocity warning, such as an undefined reference or a method call that returned null. The script still evaluated; warnings flag likely typos in non-strict mode.
    BodyPart:
      type: object
      properties:
        contentDisposition:
          $ref: '#/components/schemas/ContentDisposition'
        entity:
          type: object
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        mediaType:
          type: object
          properties:
            type:
              type: string
            subtype:
              type: string
            parameters:
              type: object
              additionalProperties:
                type: string
            wildcardType:
              type: boolean
            wildcardSubtype:
              type: boolean
        messageBodyWorkers:
          $ref: '#/components/schemas/MessageBodyWorkers'
        parent:
          $ref: '#/components/schemas/MultiPart'
        providers:
          type: object
        parameterizedHeaders:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ParameterizedHeader'
    ParameterizedHeader:
      type: object
      properties:
        value:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
    ContentDisposition:
      type: object
      properties:
        type:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        fileName:
          type: string
        creationDate:
          type: string
          format: date-time
        modificationDate:
          type: string
          format: date-time
        readDate:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
    FormDataBodyPart:
      type: object
      properties:
        contentDisposition:
          $ref: '#/components/schemas/ContentDisposition'
        entity:
          type: object
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        mediaType:
          type: object
          properties:
            type:
              type: string
            subtype:
              type: string
            parameters:
              type: object
              additionalProperties:
                type: string
            wildcardType:
              type: boolean
            wildcardSubtype:
              type: boolean
        messageBodyWorkers:
          $ref: '#/components/schemas/MessageBodyWorkers'
        parent:
          $ref: '#/components/schemas/MultiPart'
        providers:
          type: object
        formDataContentDisposition:
          $ref: '#/components/schemas/FormDataContentDisposition'
        simple:
          type: boolean
        name:
          type: string
        value:
          type: string
        parameterizedHeaders:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ParameterizedHeader'
    MessageBodyWorkers:
      type: object
    VelocityErrorView:
      type: object
      properties:
        message:
          type: string
          description: Concise, single-line Velocity error message including the offending token and position when available. See `detail` for the full engine output.
          example: Encountered "<EOF>" at line 6, column 39
        errorType:
          type: string
          description: Simple class name of the underlying Velocity error, normalized to the public Velocity type (e.g. ParseErrorException, MethodInvocationException, ResourceNotFoundException) rather than a dotCMS-internal subclass. Lets the caller distinguish a syntax error from a runtime error.
          example: ParseErrorException
        templateName:
          type: string
          description: Name Velocity associated with the evaluated template. For dynamic requests this is a synthetic name identifying the submitted script.
          example: dynamic velocity
        line:
          type: integer
          description: 1-based line number in the submitted velocity where the error occurred, when Velocity reports it. Omitted when unavailable.
          format: int32
          example: 6
        column:
          type: integer
          description: 1-based column number in the submitted velocity where the error occurred, when Velocity reports it. Omitted when unavailable.
          format: int32
          example: 39
        detail:
          type: string
          description: Full, multi-line engine output for the error, including the complete grammar-token list for parse errors. Intended for human display; omitted when it adds nothing beyond `message`.
          example: "Encountered \"<EOF>\" at line 6, column 39\nWas expecting one of:\n    \"[\" ...\n    \"(\" ..."
      description: A single Velocity evaluation error, structured so an automated caller can locate and fix the offending code without parsing a stack trace.
    FormDataContentDisposition:
      type: object
      properties:
        type:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        fileName:
          type: string
        creationDate:
          type: string
          format: date-time
        modificationDate:
          type: string
          format: date-time
        readDate:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        name:
          type: string
    MultiPart:
      type: object
      properties:
        contentDisposition:
          $ref: '#/components/schemas/ContentDisposition'
        entity:
          type: object
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        mediaType:
          type: object
          properties:
            type:
              type: string
            subtype:
              type: string
            parameters:
              type: object
              additionalProperties:
                type: string
            wildcardType:
              type: boolean
            wildcardSubtype:
              type: boolean
        messageBodyWorkers:
          $ref: '#/components/schemas/MessageBodyWorkers'
        parent:
          $ref: '#/components/schemas/MultiPart'
        providers:
          type: object
        bodyParts:
          type: array
          items:
            $ref: '#/components/schemas/BodyPart'
        parameterizedHeaders:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ParameterizedHeader'
    VelocityErrorResponseView:
      type: object
      properties:
        errors:
          type: array
          description: List of Velocity errors detected while evaluating the submitted code.
          items:
            $ref: '#/components/schemas/VelocityErrorView'
        warnings:
          type: array
          description: Non-fatal warnings (undefined references, null method results) observed before the error. Omitted when there are none.
          items:
            $ref: '#/components/schemas/VelocityWarningView'
