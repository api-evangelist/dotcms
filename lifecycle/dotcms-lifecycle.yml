description: >-
  dotCMS is versioned as a shipped product, not as a hosted API version train. There is no
  /v1 -> /v2 API contract version to negotiate; the API version you get is the version of the
  instance you are pointed at, which for a self-hosted or cloud customer is a deployment
  decision. The lifecycle that matters to an integrator is therefore the RELEASE lifecycle:
  which build a customer is on, how long it is supported, and how much warning a removal gets.
versioning:
  scheme: calendar
  format: YY.MM.DD-NN
  current: 26.09.03-01
  current_released: '2026-09-03'
  docs: https://dev.dotcms.com/docs/reference/releases/product-versions/changelogs
  note: >-
    Releases are tagged v26.09.03-01 style in dotCMS/core, with the CLI released on the same
    train under dotcms-cli-26.09.03-01. The OpenAPI itself declares info.version "3", which is
    the REST API generation, not the product version — the two are independent and both are
    recorded here so an agent does not confuse them.
  api_version_in_spec: '3'
  path_versioning:
    observed: true
    note: >-
      Paths carry /api/v1/, /api/v2/ and a legacy unversioned /api/ prefix simultaneously; 49
      operations in the spec are flagged deprecated:true, mostly the unversioned legacy shapes
      (/api/content/{params}, /api/role/loadbyid/{params}) and the v1 tag endpoints superseded by
      v2. Version is per-endpoint, not per-API.
release_tracks:
- name: Current release
  support_window: 1 year from release date
  note: Standard agile releases.
- name: LTS (Long-Term Supported)
  support_window: minimum 18 months from LTS designation
  note: >-
    "LTS patch releases are explicitly designed to be installable with minimal risk and without
    the need for a full upgrade" — often under ten minutes of downtime on a single node. The
    current LTS series observed on the release feed is 25.07.10_lts_v18 (patched 2026-09-01).
deprecation:
  policy_url: https://dev.dotcms.com/docs/reference/releases/product-versions/release-support-lifecycle
  advance_notice: 6 months
  sunset_header: false
  policy: >-
    "Deprecations are announced at least six months before the impact reaches customer
    instances." Deprecated functionality keeps working during that window before removal.
    Releases carrying significant architectural shifts are labelled Breaking Change releases so
    customers can size the migration.
  end_of_life: >-
    Past EOL, Enterprise customers receive "patches and hotfixes ... for critical security
    vulnerabilities only, at the discretion of dotCMS."
  machine_signal:
    in_spec: true
    mechanism: OpenAPI deprecated:true
    count: 49
    note: >-
      dotCMS does mark deprecation in the contract, which is more than most providers do — but it
      does not emit RFC 8594 Sunset or Deprecation response headers, so a running agent gets no
      runtime warning. The only machine-readable deprecation signal is design-time, in the spec.
