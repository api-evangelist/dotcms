description: >-
  dotCMS ships its first-party client libraries as an npm scope (@dotcms/*) cut from a single
  monorepo release train — every JavaScript package below shares one version string and one
  publish date, which makes the whole SDK surface easy to date. Registries probed with no
  first-party dotCMS package found: PyPI, RubyGems, crates.io, NuGet, Packagist, pkg.go.dev.
  dotCMS is a Java platform but publishes no client artifact to Maven Central; the Java surface
  is the server itself, distributed as a Docker image and a WAR, not as a client SDK.
