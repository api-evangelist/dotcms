  name: dotCMS REST API
  tags:
  - CMS
  - Content
  - Content Management
  humanURL: https://dev.dotcms.com/docs/build/apis/api-basics/rest-apis
  baseURL: https://demo.dotcms.com/api
  properties:
  - url: https://dev.dotcms.com/docs/build/apis/api-basics/rest-apis
