apis:
- aid: dotcms:rest
  name: dotCMS REST API
  tags:
  - CMS
  - Content
  - Content Management
  humanURL: https://dev.dotcms.com/docs/getting-started-rest-apis
  baseURL: https://demo.dotcms.com/api
  properties:
  - url: https://dev.dotcms.com/docs/getting-started-rest-apis
    type: Documentation
  - url: https://dev.dotcms.com/docs
    type: Developer
  description: >-
    The dotCMS REST API exposes the platform's content management capabilities through HTTP endpoints,
    allowing developers to create, read, update, and delete content, manage workflows, navigate site hierarchy,
    perform search queries, and administer users, roles, and permissions. The API is organized into resource
    groups including Content, Workflow, Search, Navigation, Sites, and User management, and supports authentication
    via JWT tokens, basic auth, and API keys.
- aid: dotcms:graphql
  name: dotCMS GraphQL API
  tags:
  - CMS
  - Content
  - Content Management
  - GraphQL
  humanURL: https://dev.dotcms.com/docs/graphql
  baseURL: https://demo.dotcms.com/api/v1/graphql
  properties:
  - url: https://dev.dotcms.com/docs/graphql
    type: Documentation
  - url: graphql/dotcms-graphql.md
    type: GraphQL
  description: >-
    The dotCMS GraphQL API provides a single endpoint for querying content across all content types using
    a self-documenting schema. It supports Lucene-style query strings, pagination, sorting, and content-type
    collections, and exposes base types for File, Form, Key/Value, Page, Persona, Vanity URL, and Widget
    content. The API accepts the same authentication methods as the dotCMS REST API and includes a built-in
    GraphQL Playground for exploring the schema.
