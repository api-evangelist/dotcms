description: >-
  dotCMS is a Java-based visual headless content management system aimed at compliance-led
  enterprises, deployable as SaaS (dotCMS Cloud), on premise, or as a managed service. It covers
  content modelling, authoring, workflow, multi-site management, personalization, experiments and
  content analytics, and pairs headless delivery with a Universal Visual Editor so authors can
  edit content in place inside a React, Angular or Next.js front end. Every dotCMS instance
  serves its own first-party OpenAPI 3.0.1 at /api/openapi.json — 592 paths and 754 operations
  across 71 tags, covering content, content types, workflow, publishing, sites, roles,
  permissions and dotAI — alongside a GraphQL endpoint at /api/v1/graphql. dotCMS also ships an
  early agent surface: a first-party MCP server, two published Agent Skills, an RFC 9727 API
  catalog and markdown content negotiation. It is certified to ISO/IEC 27001, ISO/IEC 42001 (AI
  management), SOC 2 Type II and TX-RAMP Level II.
